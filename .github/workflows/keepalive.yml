name: Supabase Keepalive

on:
  schedule:
    - cron: '0 0,12 * * *' # 每天两次
  workflow_dispatch: # 支持手动测试

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [SINGAPORE, MUMBAI] # 定义你的项目代号
    steps:
      - name: Ping ${{ matrix.project }} Project
        run: |
          # 根据矩阵变量动态获取对应的 Secrets
          URL="SUPABASE_URL_${{ matrix.project }}"
          KEY="SUPABASE_KEY_${{ matrix.project }}"
          
          curl -X POST "${{!URL}}/rest/v1/keepalive" \
            -H "apikey: ${{!KEY}}" \
            -H "Authorization: Bearer ${{!KEY}}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}' --fail --show-error
            
      - name: Log status
        run: echo "Project ${{ matrix.project }} pinged at $(date)"
